skillId: foundation-planning
version: 1.0.3
executionPoints:
  - foundation.book-plan
  - arc.plan
  - arc.revision
  - chapter.blueprint
roles:
  - planner
  - reviser
  - foundation-reviewer
capabilities:
  - planning
dependsOn: []
conflicts: []
requiredMemoryKinds: []
qualityGates:
  - global-causality
  - plan-executability
priority: required
promptSections:
  foundation.book-plan: |
    先建立全书的可执行骨架：读者承诺、主题问题、人物欲望/需要/矛盾、外部压力、世界规则与代价、主线/支线/关系线、伏笔责任、终局边界和阶段终点。每项规划必须说明它如何改变人物选择或读者理解，并区分已确认事实、推导方案和待确认项，避免只堆设定名词。卷与卷之间必须传递可验证的状态：每一卷的入口状态要能由上一卷退出状态推出，主要承诺要落在明确的回收窗口，终局边界要同时约束主线、支线和关系线的收束方式。
    大众读者认知边界：读者可见的表面（卷名、章节名、概念与术语命名）必须落在本作目标读者熟悉的知识范围内；专业/技术概念只存在于机制层或人物认知推理中，出现在表面时必须转入本作自定的表层语域（该语域是项目层的世界观材料，由题材决定，通用指引不指定它应该是哪一类词），且全篇同一译名。机制可推导不等于表面可技术化。
    揭示物分层：核心创意与世界观真相是剧情揭示物而非开篇设定——规划须区分世界表面事实（开局即成立）、异常现象（主角逐步发现的可观察证据）与底层真相（长线揭示目标）；禁止把应逐步揭示的真相写成开篇既定的世界观基石，删除该真相后开局仍应成立。
    核心概念译名表：规划应产出'机制概念→读者可见译名'的对应表——左列是机制层的原名，右列是上面那条表层语域里的说法；具体成对示例属项目层材料，不写进通用指引。卷名、章节名、概念命名与正文沿用该表；同一概念全篇同一译名，叙述表层不得出现未转译的机制原词。人物声口不在此禁令之内（见 chapter.blueprint）。
  arc.plan: |
    故事弧必须从已知状态出发，经由欲望/压力、选择、代价和可观察状态变化抵达明确的退出状态，并记录新问题、承诺窗口和各条线的当前责任。为每章保留真实的执行空间，不把整卷压缩为同质化事件清单。
  arc.revision: |
    修订故事弧时按最低层级修复：先修状态和事实边界，再修因果、人物选择、线索责任和阶段边界。保留有效积累与未解空间，不为满足抽象标签新增无依据的人物、事件或固定节奏。
  chapter.blueprint: |
    章节蓝图需要冻结本章起始状态、视角知识边界、目标/阻力、关键场景、人物选择与代价、可观察证据、连续性边界、余波和自然收束条件；它是正文执行材料，不是正文摘要或事件清单。章节名与叙述表层面向大众读者：标题与世界标签用译名表里的表层说法，不用未转译的机制原词或外文学词。边界（与正文侧声部许可互不越界）：禁令只管叙述者给世界贴标签的层面；人物自身的专业/技术认知可以作为该人物的声部保留原词，按正文指引对"技术认知承担正文信息"的条件取舍，蓝图不得为统一腔调要求把人物声口一并抹平。
