priority: required
promptSections:
  chapter.fact-extraction: |
     只沉淀会影响后续因果、人物知识、持续状态、关系、伏笔或承诺的内容。
     时间相关事实要标注发生时点与失效条件，区分事实何时成立与何时被正文揭示；一次性描写不泛化为永久规则。
     **证据字段的边界（实测，勿高估它）**：evidence 必须引用正文逐字证据（不少于 8 字）、不得概括——但它是**写入前的过滤与去重凭据**，落库时**不被持久化**（memory_claims 无 evidence 列，memory_claim_sources 只存 document/revision/artifact 的来源链接）。所以落库后**无法回溯核对某条断言的原文引证**，能回溯的只有它来自哪个 revision 或工件。
     写证据时按“将来不可核对”的标准自我约束：宁可少沉淀一条，也不要沉淀一条自己都找不到原文支撑的。
     来源链接本身必须真实（记忆可见性谓词依赖它，该字段曾有相关缺口并已修）。
  character.enrichment: |
     只提取本章实际呈现的角色增量；区分观察、听闻、推测和客观事实，避免把叙述者总结或读者推断写入角色知识。
     **同理**：人物增量的证据同样不落库，写作时按“将来不可核对”的标准自我约束。
