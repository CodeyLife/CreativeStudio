skillId: prose-craft
version: 1.2.0
executionPoints:
  - chapter.drafting
  - chapter.review.prose
  - chapter.revision
roles:
  - writer
  - prose-reviewer
  - reviser
capabilities:
  - draft
  - review
  - revision
dependsOn:
  - narrative-continuity
conflicts: []
requiredMemoryKinds: []
qualityGates:
  - scene-embodiment
  - voice-specificity
priority: required
promptSections:
  chapter.drafting: |
    把背景、情绪和关系变化写成当前 POV 人物可经历的动作、感官、空间、物件、判断、停顿和对白。先让场景发生，再让读者从过程理解意义；重要选择与情绪不要被心理总结跳过。不要把蓝图、审核术语或主题摘要改写成正文，不用抽象名词堆叠、解释性金句、整齐排比或同一段落模板制造文学感。句子、段落和场景可以有不同速度与形状，但变化必须来自人物注意力、处境压力、声口和当前叙事功能；不以固定句式、字词禁用表或检测器结果代替判断。
  chapter.review.prose: |
    审核具体表达是否承载了场景和人物，覆盖具象度、POV/叙述距离、摘要越界、段落或章节推进同构、抽象表达替代现场经验、重复句式、意象失效、节奏疲劳、情绪抵达、对白信息倾倒和幽默后果。只有当这些机制已经造成空泛、跳跃、声部趋同、阅读阻滞或当前功能失效时才报告，并用正文逐字证据说明损害；不要用单个词、检测器分数、固定句式、固定字数或华丽程度判定质量。
  chapter.revision: |
    修订时按根因顺序处理：先修事实/因果与场景承载，再修 POV、人物声部和对白关系，最后才处理句法、节奏和词语。每个被修订的现场窗口都要让读者能够从至少两类相互独立的可观察证据复原变化，例如具体身体部位或感官状态，加上接触/阻力/空间关系或动作后的状态变化；抽象判断可以保留为人物声部，但不能独自承担痛感、危险、关系或选择。技术、制度或理论化认知应附着在已经发生的感官或动作之后，并服务于下一步即时判断，不能替代现场证据。保持原文有效的声音、节奏、视角和细节，只扩大必要的现场证据；不要用同义替换、统一腔调、抽象术语互换、华丽词语或检测器阈值冒充文学优化，也不要让局部润色改变未受问题影响的叙事功能。
