skillId: prose-craft
version: 1.3.1
executionPoints:
  - chapter.drafting
  - chapter.review.prose
  - chapter.revision
roles:
  - writer
  - prose-reviewer
  - reviser
capabilities:
  - draft
  - review
  - revision
dependsOn:
  - narrative-continuity
conflicts: []
requiredMemoryKinds: []
qualityGates:
  - scene-embodiment
  - voice-specificity
priority: required
promptSections:
  chapter.drafting: |
    把背景、情绪和关系变化写成当前 POV 人物可经历的动作、感官、空间、物件、判断、停顿和对白。表达可以有风格，现场信息不能缺失：普通读者不必立即理解每个陌生词，但应能从上下文复原人物正在经历什么、为何行动以及行动造成的结果。重要选择与情绪不要被心理总结跳过。技术、制度或理论化认知可以构成人物声部，但只有在改变即时选择、表达角色独有认知或承担不可替代的世界观功能时才让它承担正文信息；技术认知不能成为当前动作的唯一主语、原因或结果，身体危机和动作场景先让必要的身体或物理反应成立，再让技术判断服务于下一步选择。同一局部节拍中重复命名同一体验的技术标签应删去多余部分；删掉技术句后事实、选择和因果都不变时，不保留它，也不改换成另一组抽象词。否则把它转化为自然中文的动作、感受、空间关系、对白或结果。不要把蓝图、审核术语或主题摘要改写成正文，不用抽象名词堆叠、解释性金句、整齐排比或同一段落模板制造文学感。句子、段落和场景可以有不同速度与形状，但变化必须来自人物注意力、处境压力、声口和当前叙事功能；不以固定句式、字词禁用表或检测器结果代替判断。
  chapter.review.prose: |
    审核具体表达是否承载了场景和人物，覆盖具象度、POV/叙述距离、摘要越界、段落或章节推进同构、抽象表达替代现场经验、普通读者现场复原、重复句式、意象失效、节奏疲劳、情绪抵达、对白信息倾倒和幽默后果。只有当这些机制已经造成空泛、跳跃、声部趋同、阅读阻滞或当前功能失效时才报告；若属于普通读者无法复原现场的问题，必须说明缺少哪类证据以及读者具体无法判断什么。不要用单个词、检测器分数、固定句式、固定字数或华丽程度判定质量。
  chapter.revision: |
    修订时按根因顺序处理：先修事实/因果与场景承载，再修 POV、人物声部和对白关系，最后才处理句法、节奏和词语。每个被修订的现场窗口都要让读者能够从当前功能所需的可观察证据复原变化；可以使用身体部位、感官状态、接触、阻力、空间关系、对白反馈或动作后的状态变化，按场景需要选择，不要求机械凑齐清单。抽象判断可以保留为人物声部，但不能独自承担痛感、危险、关系或选择。技术认知应附着在已经发生的感官或动作之后，不能成为当前动作的唯一主语、原因或结果；删掉后事实、选择和因果都不变的重复技术标签应直接删去，不要换成另一组抽象词。保持原文有效的声音、节奏、视角和细节，只扩大必要的现场证据；不要用同义替换、统一腔调、抽象术语互换、华丽词语或检测器阈值冒充文学优化，也不要让局部润色改变未受问题影响的叙事功能。
