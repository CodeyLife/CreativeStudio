promptSections:
  chapter.drafting: |
    把背景、情绪和关系变化写成当前 POV 人物可经历的动作、感官、空间、物件、判断、停顿和对白。表达可以有风格，现场信息不能缺失：普通读者不必立即理解每个陌生词，但应能从上下文复原人物正在经历什么、为何行动以及行动造成的结果。重要选择与情绪不要被心理总结跳过。叙述者不替读者论证：人物的选择、情绪与动机只用现场动作、感官、接触、对白和后果呈现，不追加解释性段落替读者说明动机或意义；**情绪节拍的病灶是"表情 + 一句释义"，不是表情本身**（2026-10-14 round 31 按机制拆族后窄化，`tmp/state-audit/split-face-idiom-mechanisms.mts`）。把"面部表情"按**机制**拆三种后结论差别很大：**A 表情+释义**（眼/眉/嘴角的动作后紧跟"那眼神里没有X，只有Y""不像在看人，像在看…"）全书 27 处、**全部落在 ch2—ch72**、**ch73 以后一处都没有**、合格带 0.055/千字 vs 混合带 0.186（3.4 倍）、**最强带 099-127 为 0** ⇒ 这是早期被作者自己写掉的习性，是本族里唯一确凿的病灶。**B 单一个标记不解释**（"眼皮耷拉着""嘴角撇了一下"然后走开）全书 76 处、ch73 后仍有 26 处、合格带 30 处 vs 混合带 27 处（基本持平）⇒ **不是病，是稳定的手艺**，不得因"又一个表情标记"而报。**C 表情捆在肢体动作里**（"抬了抬眼皮""弯下腰，侧过头"）22 处、最强带为 0、比值虽高但基数小。故判据是：**只有当表情后面紧跟一句解释它意味着什么时才报**，并问"这段情绪能否由动作、选择或对白后果承担"；单标记与肢体捆绑的表情都不报。删掉这个表情时问一句：读者是会失去一个可观察的线索，还是只失去一个标签。旧的"七面并族"依据（round 19/20：合计密度合格带 0.215 vs 混合带 0.63、最强带 0.05、并已排除"独处章没有第二张脸"的混杂）仍然成立，但它**只支撑 A 这一种机制**——把 B/C 一并列进指引是并族造成的过宽，round 31 已收窄。制度、账目、规矩等题材内词汇可以承担叙事信息，但不得取代当场的动作与接触。技术、制度或理论化认知可以构成人物声部，但只有在改变即时选择、表达角色独有认知或承担不可替代的世界观功能时才让它承担正文信息；技术认知不能成为当前动作的唯一主语、原因或结果，身体危机和动作场景先让必要的身体或物理反应成立，再让技术判断服务于下一步选择。同一局部节拍中重复命名同一体验的技术标签应删去多余部分；删掉技术句后事实、选择和因果都不变时，不保留它，也不改换成另一组抽象词。否则把它转化为自然中文的动作、感受、空间关系、对白或结果。不要把蓝图、审核术语或主题摘要改写成正文，不用抽象名词堆叠、解释性金句、整齐排比或同一段落模板制造文学感。句子、段落和场景可以有不同速度与形状，但变化必须来自人物注意力、处境压力、声口和当前叙事功能；不以固定句式、字词禁用表或检测器结果代替判断。同一章内一个认知结论只用一个比喻命名：用多个不同比喻反复重命名同一判断（如处境危险、被控制）是堆叠，数一下同章内表达同一判断的比喻个数，两个以上就留最贴合人物当下处境与注意力的那个，其余改为具体动作、物件或身体状态。章尾只承担钩子、余波、状态落点之一：钩子是具体的未解威胁或选择压向下一章；余波用身体、物件、环境承载情绪而不新增性格结论；状态落点一句话确认变化即收束。章尾不要连续短句宣告同一结论，不要从可感观察滑入概括议论，不要连环比喻宣读主题；收束前问自己：删掉最后三段，读者对接下来会发生什么的期待是变强还是消失。有随从、同伴在场的对手戏，每个具名角色都要有至少一个独立于主角观察的可观察反应（犹豫、多余动作、插话），否则群像塌成主角视角的回声。**清点与触觉判定的跨章惯性**：主角独处时反复以同一套动作序列清点随身物件、并给每件配一次同类的温度或质感判定，单章看是有效的身体在场，跨章复现就变成读者能预判的仪式——它替代了本章本该发生的交锋与变化。判据不是不准写清点，而是本章这次清点必须与以往任何一次不同：它要带来新信息（某件的位置或状态真的变了）、新选择（据此决定下一步）或新代价（清点本身有风险），三者都不成立时改为写清点之后的那一个动作。**机制拆分实测（2026-10-14 round 32，`tmp/state-audit/split-inventory-mechanisms.mts`）确认这条判据校准准确**：把清点按机制拆开后——**A 清点即情报**（点名后紧跟该件的位置/状态变化）全书 127 处、ch73 后仍有 21 章在用、是稳定的手艺；**B 清点即存在感**（只摸不报变化）全书 53 处、ch73 后只剩 6 章、**最强带 099-127 为 0.000**；**C 温度判定**（给物件配一次"凉/冷"）全书 317 处、密度与强度负相关最强（合格带 0.63 vs 混合带 1.25 = 1.97 倍、最强带仅 0.34）——**C 正是本条款要治的那半，且它是三族里基数最大、信号最强的一族**。**最强带直读是最硬的证据：该带 29 章里 A 型 15 处、B 型 0 处**（ch99「玉牌贴着右肋，凉的」紧接着 ch103「把回执展开…夹层里，多了一枚圈」——清点本身就是发现）。⇒ 最好的章只用 A，从不用 B；所以"必须带来新信息/新选择/新代价"不是限制，而是本书最好手法的**定义式**。**数数不是同族惯性**（2026-10-14 可达性验证后撤回了 round 2 的误判）："数呼吸/数天色/数脚步/第几遍"在本书里承担的是**时间感与内心节律本身**，实测它与章节强度正相关而非负相关——四个合格带的均值 0.57/千字高于含不合格的混合带 0.44，全书最强的 099-127 带 0.75 为各带最高，而质量最差的 001-014 带仅 0.05。该带中最强的用法里，数数就是章的核心意象与认知过程（ch124「他数着自己的步子，又数着笔声的拍子」；ch110「把那三个字在心里重新说了一遍／第一遍…」；ch123「翻出一串数字，四十七…答案不是新路，答案是旧路」）。故数数只在**同一章内反复以同一动作收尾且不带新信息**时才报，不得仅因"又出现数数"而报。**序数作推演编号是本书最强的正面声音，修订时不得"理顺"掉它**（2026-10-14 round 30 拆族实测，`tmp/state-audit/measure-counting-mechanisms.mts`）：把"数数"按**机制**拆成三种后结论完全不同——节律型（数呼吸/天色/脚步）全书 0.13/千字、与强度基本无关；**分析型**（序数作推演编号：第一遍/第二遍/第X步/第X息/第X枚/第X处）全书 **0.83**、合格带 **0.94**、混合带 **0.36**、**全书最强的 099-127 带 1.23（混合带的 3.4 倍）**，原始计数 326 处、非小样本；对照的叙事时间戳（第X章/日/月）0.23、与强度无关。⇒ 分析型计数**不是**"用序号替代论证"，它就是论证本身：ch123 的「第一遍，他先走量词的路／第二遍，他走另一条路」是穷举假设，「第一步到第七步，檐影…第八步到第十九步，过井台」是带证据的空间复原。直读该章可见计数与推演一一对应。**故修订面不得把这类序数改成"他想了想""反复推敲"之类的概述**——那会把本书最可靠的严谨感换成最廉价的陈词。只在同一处重复同一编号（如三段都用"第一遍"开头而实际没有三段）时才报，并说明它挤掉了什么。
  chapter.review.prose: |
    审核具体表达是否承载了场景和人物，覆盖具象度、POV/叙述距离、摘要越界、段落或章节推进同构、抽象表达替代现场经验、普通读者现场复原、重复句式、意象失效、节奏疲劳、情绪抵达、对白信息倾倒和幽默后果。同章同义比喻堆叠、章尾收束纪律、叙述者替读者论证与跨章清点惯性是必查项：同一章内多个不同比喻重命名同一认知结论、章尾连续短句宣告同一结论、章尾从可感观察滑入概括议论、章尾连环比喻宣读主题、环境异动钩子缺少与本章事件的最小因果锚点、随从类具名角色全员只对主角做反应、叙述者以整段解释性论证替代现场动作、**情绪节拍由"表情 + 一句解释它意味着什么"承担（眼/眉/嘴角的动作后紧跟"那眼神里没有X，只有Y""不像在看人，像在看…"）而该节拍本可由动作、选择或对白后果承担**（round 31 窄化：全书 27 处全在 ch2—ch72、最强带 0 ⇒ 确凿病灶；**单一个表情标记不解释、以及捆在肢体动作里的表情都不报**——前者 76 处且 ch73 后仍有 26 处、合格带与混合带持平，是稳定手艺）、独处章以逐件清点随身物件并配同类温度或质感判定填满篇幅且该次清点未带来新信息新选择或新代价、同一章内反复以同一动作收尾而不带新信息——这些机制已造成叙事距离拉远、节拍重复或群像失真时报问题，报告时给出段落范围与首个比喻位置。**面部表情本身合法**：只在它替代了本该由动作或对白承担的节拍时才报，并说明它挤掉了什么（本章缺的那次交锋、那次选择）。**数数（数呼吸/数天色/数脚步/第几遍）不是上述惯性的一员**：2026-10-14 实测它与章节强度正相关（四个合格带均值 0.57/千字 高于含不合格的混合带 0.44；全书最强的 099-127 带 0.75 为最高；质量最差的 001-014 带仅 0.05），直读该带可见数数常是章的核心意象与认知过程本身。故不得仅因"又出现数数"而报；只在同一章内反复以同一动作收尾、且该次收尾不带来新信息或新节律时才报，并说明它挤掉了什么。**序数作推演编号（第一遍/第二遍/第X步/第X息/第X枚/第X处）是本书最强的正面声音，修订时不得"理顺"掉它**（round 30 拆族实测：分析型全书 0.83/千字、合格带 0.94、混合带 0.36、**最强带 1.23＝混合带的 3.4 倍**、原始 326 处；它是论证本身——ch123「第一遍，他先走量词的路／第二遍，他走另一条路」是穷举假设，「第一步到第七步，檐影…第八步到第十九步，过井台」是带证据的空间复原）。故**不得**建议把这类序数改成"他想了想""反复推敲"等概述；只在同一处重复同一编号而实际没有那么多段时才报，并说明它挤掉了什么。清点惯性的报告必须指明它挤掉了什么（本章缺的那次交锋、那次变化），因为动刀理由是"该有的现场没发生"，不是"这个动作出现太多次"。只有当这些机制已经造成空泛、跳跃、声部趋同、阅读阻滞或当前功能失效时才报告；若属于普通读者无法复原现场的问题，必须说明缺少哪类证据以及读者具体无法判断什么。不要用单个词、检测器分数、固定句式、固定字数或华丽程度判定质量。
  chapter.revision: |
    修订时按根因顺序处理：先修事实/因果与场景承载，再修 POV、人物声部和对白关系，最后才处理句法、节奏和词语。清点惯性的修法不是把物件清单删掉，而是给这次清点安上它缺失的功能：让它披露一个新的事实、逼出一个新选择，或让它本身付出代价；三者都补不上就把它换成清点之后的那一个动作，让篇幅回到本章真正该发生的现场。面部表情节拍的修法同理，**只针对"表情 + 一句解释它的含义"这一种**：保留动作、删掉那半句解释，或把它改成本章真正缺的那次交锋里的一句对白。**不得因为"又一个表情标记"而删表情**——单标记（"眼皮耷拉着"）与捆在肢体里的表情（"抬了抬眼皮"）是稳定的手艺，round 31 实测它们在合格带与混合带密度持平、且 ch73 后仍稳定出现；删掉它们会抽掉可观察的线索。 **序数作推演编号（第一遍/第二遍/第X步/第X息/第X枚/第X处）不得被"理顺"**（round 30 拆族实测：分析型计数最强带 1.23/千字、是混合带 0.36 的 3.4 倍、原始 326 处；它就是论证本身——「第一遍，他先走量词的路／第二遍，他走另一条路」是穷举假设，「第一步到第七步，檐影…第八步到第十九步，过井台」是带证据的空间复原）：**不得**把它们改写成"他想了想""反复推敲"这类概述，也不得因为"序号太多"而合并或删除；只在同一处重复同一编号而实际没有那么多段时才动，并说明它挤掉了什么。每个被修订的现场窗口都要让读者能够从当前功能所需的可观察证据复原变化；可以使用身体部位、感官状态、接触、阻力、空间关系、对白反馈或动作后的状态变化，按场景需要选择，不要求机械凑齐清单。抽象判断可以保留为人物声部，但不能独自承担痛感、危险、关系或选择。技术认知应附着在已经发生的感官或动作之后，不能成为当前动作的唯一主语、原因或结果；删掉后事实、选择和因果都不变的重复技术标签应直接删去，不要换成另一组抽象词。同章内多个比喻重命名同一认知时，保留最贴人物当下处境的一个，其余改为动作、物件或身体状态；章尾宣告链压缩为一句后用身体或物件收束；概括议论转为人物下一步的具体打算。保持原文有效的声音、节奏、视角和细节，只扩大必要的现场证据；不要用同义替换、统一腔调、抽象术语互换、华丽词语或检测器阈值冒充文学优化，也不要让局部润色改变未受问题影响的叙事功能。
