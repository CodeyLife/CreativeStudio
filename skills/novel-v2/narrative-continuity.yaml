skillId: narrative-continuity
version: 1.1.0
# 1.1.0 = 事实矛盾确定性核验接入 chapter.fact-extraction（improvement-plan-fact-injection-20260922
# 迭代 2）：提取后对值槽谓词做同槽异值对账，矛盾候选强制 candidate，未裁决不得晋升。
# 1.0.2 = craft-rule 闭环晋升（crc-1786247823320-f48c8df7，promotion_receipts:
# promote:crc-1786247823320-f48c8df7，双回归+晋升后验证通过）。证据边界规则：可观察
# 现象与功能/机制/统计结论分层，单次关联观测只支撑疑似；审核报证据越界为 major；修订
# 方向是降确定性而非坐实解释。运行时读 DB（database 模式），本 yaml 为 seed 真源。
executionPoints:
  - foundation.book-plan
  - arc.plan
  - arc.review
  - arc.revision
  - chapter.drafting
  - chapter.review.structure
  - chapter.revision
  - chapter.fact-extraction
  - character.enrichment
capabilities:
  - continuity
  - memory
dependsOn: []
conflicts: []
requiredMemoryKinds: []
qualityGates:
  - state-continuity
  - knowledge-boundary
priority: required
promptSections:
  foundation.book-plan: |
    所有长期设定都必须能回到人物行动、关系变化、行动成本或后续约束；区分已确认事实、规划判断、隐藏信息、尚未设计的信息和待确认内容。
  arc.plan: |
    检查每一章的状态转移、知识边界和证据，确保前章结果成为后章可用的处境，而不是只在摘要中口头连接；未解事项要明确保留，不提前升级确定性。角色认知结论必须区分"可观察现象"与"功能/机制/统计结论"：单次或少数几次关联观测、零散传闻只能支撑"疑似/怀疑/有待验证"，不得写成"确认""证明""了解具体机制/具体数量"等确定性表述；同一现象的解释保持多种可能并存，直到有足够证据收敛。
  arc.review: |
    依据蓝图中的实际状态、因果、知识边界和权威路径审核连续性，不因为章节安静、没有新事件或没有固定钩子而直接判定失败；只报告证据支持的状态或权威越界。当状态转换或机制结论明显超出场景证据（如把一次关联观测写成确认机制、把一句传闻写成统计结论）时，报告为证据越界并要求改为推测表述。
  arc.revision: |
    修订只能统一已建立的事实和状态边界，不得把审核意见中的猜测提升为新的世界事实；对证据越界的修订方向是把确定性降为"疑似/推测"，而不是补充更完整的解释来坐实结论。
  chapter.drafting: |
    写作时遵守叙事截止、视角人物知识边界、既有世界规则和人物当前状态；连续性约束应通过可感知行动、判断、信息差和后果体现，而不是机械复述设定。章节记忆、序列证据等派生记忆只提供承接方向与统计信号，不能替代正文现场，也不把其中任何措辞变成逐章必填项。叙述者与视角人物的知识量不得超过正文已呈现的证据：对未知机制、他人动机、统计事实的推断以怀疑、猜测、证据不足的方式呈现，不用确认语气收束。
  chapter.review.structure: |
    只依据冻结事实、章节规划和正文证据检查时间线、世界规则、人物知识、关系状态和伏笔账本；不把安静章节或未承担相关内容的章节强行判为失败。若正文/状态把缺乏证据的推断写成确定结论，报告为证据越界（major）。
  chapter.revision: |
    修订正文不得新增冻结来源和原文都未建立的事实；无法确认的边界保持原状，不用修辞性解释掩盖不确定性。修订不得把推断升级为确认，也不得通过补充细节使原本未知的机制显得已被证实。
  chapter.fact-extraction: |
    只提取会约束后续因果、知识边界、状态或关系的事实；记录来源证据和 novelty，不把一次性描写泛化为永久事实。提取后系统对值槽谓词（持有/位于/身份/修为等单当前值槽位）执行确定性矛盾核验：与冻结事实同槽异值且未携带 supersedes 的候选将被强制降为 candidate，冲突未裁决不得晋升为可检索事实；正文改写既有事实时必须以 novelty=update 显式声明覆盖。
  character.enrichment: |
    只回写正文实际呈现的角色声部、动机、知识和关系增量，并保留观察、听闻和推测之间的确定性差异。
