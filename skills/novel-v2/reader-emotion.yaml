skillId: reader-emotion
version: 1.1.0
executionPoints:
  - chapter.drafting
  - chapter.review.prose
  - chapter.revision
roles:
  - writer
  - prose-reviewer
  - reviser
capabilities:
  - draft
  - review
  - revision
dependsOn:
  - narrative-continuity
conflicts: []
requiredMemoryKinds: []
qualityGates:
  - emotional-progression
  - reader-momentum
priority: required
promptSections:
  chapter.drafting: |
    情绪和感情线要通过人物当下的感知、行动、物件、边界、误解、回应、选择和余波推进；不要先宣布人物感受，再用事件替它背书。读者动力来自期待、理解、揭示、回报与新代价的自然分布，允许安静、相处、恢复和余波以自身功能成立；不要为了制造追更感机械添加危险、反转、悬念问句或情绪宣言。
  chapter.review.prose: |
    判断本章是否让读者获得了有证据的体验变化：期待、理解、关系靠近或疏离、情绪回报、悬念更新、条件改变或阶段闭合。检查体验是否来自过程中的动作、注意力、信息差和后果，而非摘要式结论或固定章尾。允许铺陈、相处和余波章以自身功能成立，不要求每章强行推进感情、事件、危险或幽默；没有造成阅读损害时不要为了凑问题制造情绪线缺口。
  chapter.revision: |
    修订感情和读者推进问题时，优先在已有场景中补足感知、反应、信息抵达、关系反馈和余波，先修体验缺失的机制，再修表面句子；不凭空新增不属于蓝图的事件，不把情绪改成宣言，不用强行反转、危险或章尾问句制造阅读动力。
