skillId: reader-emotion
version: 1.2.2
executionPoints:
  - chapter.drafting
  - chapter.review.prose
  - chapter.revision
roles:
  - writer
  - prose-reviewer
  - reviser
capabilities:
  - draft
  - review
  - revision
dependsOn:
  - narrative-continuity
conflicts: []
requiredMemoryKinds: []
qualityGates:
  - emotional-progression
  - reader-momentum
priority: required
promptSections:
  chapter.drafting: |
    情绪和感情线要通过人物当下的感知、行动、物件、边界、误解、回应、选择和余波推进；不要先宣布人物感受，再用事件替它背书。读者动力来自期待、理解、揭示、回报与新代价的自然分布，允许安静、相处、恢复和余波以自身功能成立；不要为了制造追更感机械添加危险、反转、悬念问句或情绪宣言。
     **实测**：
     宣告型（情绪词后只跟抽象名词、无承载物）仅 **1 处**，合格带 0、**最强带 0**——
     与问句收尾、总结连接词同族，**这条禁令从未被真正触发过**，
     该类作品本来就不宣布情绪。
     同时记下代理的边界：情绪词基数只有 27 处（0.054/千字），因为该类作品的情绪主要由动作、
     物件、空间承担（正是本条要求的），所以以情绪词做分母的密度指标**没有分辨力**——
     不得据此认为“情绪浓度低＝缺情绪推进”。
     另：章内疑问句 0.566/千字（最强带 0.275、混合带 1.048）是有的，与
     “章尾问句 0 处”是两个口径（禁的是收尾问句钩子，不是章内疑问）。
      **安静章与独处章的功能声明**：
      安静、相处、恢复和余波以自身功能成立——但功能需要被说出来才能被检验。
      规划独处章或安静章时，在该场景的 planningRationale 写明**这章的静在做成了什么**：
      让读者获得哪一种新理解、哪一种处境改变、或与不在场的谁形成对照。
      只写“留白”“节奏需要”“渲染氛围”不算声明（那是审美描述，不是功能判据）。
      这不是“必须加人进场”的要求：两人同场而安静同样合法，独处章同样合法，
      声明的是**功能**而不是**形态**——静可以成立，说不清它做成了什么则不成立。
  chapter.review.prose: |
    判断本章是否让读者获得了有证据的体验变化：期待、理解、关系靠近或疏离、情绪回报、悬念更新、条件改变或阶段闭合。检查体验是否来自过程中的动作、注意力、信息差和后果，而非摘要式结论或固定章尾。允许铺陈、相处和余波章以自身功能成立，不要求每章强行推进感情、事件、危险或幽默；没有造成阅读损害时不要为了凑问题制造情绪线缺口。
  chapter.revision: |
    修订感情和读者推进问题时，优先在已有场景中补足感知、反应、信息抵达、关系反馈和余波，先修体验缺失的机制，再修表面句子；不凭空新增不属于蓝图的事件，不把情绪改成宣言，不用强行反转、危险或章尾问句制造阅读动力。
