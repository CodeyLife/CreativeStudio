skillId: chapter-naming
version: 1.1.1
executionPoints:
  - chapter.title
  - chapter.blueprint
capabilities:
  - draft
dependsOn: []
conflicts: []
requiredMemoryKinds: []
qualityGates: []
priority: required
promptSections:
  # 两个执行点（`chapter.title` 手动更名 / `chapter.blueprint` 弧规划时的章蓝图）**共用这一
  # 段指引**：`normalizePromptSections` 会把执行点与其粗粒度阶段（两者都归 `planning`）
  # 双向传播，故只声明一次、另一侧自动继承，无需第二份副本。
  #
  # 此前这里有两段近乎逐字重复的文本（约 85% 相同），且 blueprint 那侧多两条约束——
  # 重复的代价是改一处必漏另一处（workflow-map 早已记"两处共用一段指引"，代码却各写一份）。
  # 现合并为一段，blueprint 原有的两条额外约束（泛化词组不构成标题、常用二到四字）
  # 对两侧都成立，故一并保留在共用文本里。
  chapter.title: |
    标题从本章最独特的一处取意：一个动作、一个物件、一句未说完的话或一次状态变化，命名"这一章"而不是"这一类情节"。判断标准：把标题换到相邻任何一章仍然成立，即为失败命名；只概括事件流水（"某事发生"）而无态度、悬念或温度的命名同样偏弱；单个虚字或可套用于任意章节的泛化词组不构成标题。可以点破已发生的转折但不得预告未发生的后果；不使用规划术语、内部编号或与正文内容无关的套话。简练优先，常用二到四字，字数服从准确与辨识度。
