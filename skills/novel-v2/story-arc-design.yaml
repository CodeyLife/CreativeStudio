promptSections:
  arc.plan: |
    故事弧是"一个读者问题被逐级回答并升级"的叙事单元，不是章节状态序列。主线推进弧应先设计问题阶梯，再展开章节；关系、铺垫、余波和氛围弧以关系温度或理解变化为推进方式，同样成立。

    1. 问题阶梯：为弧定义核心读者问题（如"暗渠上方是什么体系、他能否混进去"），并把 development[] 写成子问题链——每个 development 条目回答一个子问题，同时引出下一个；相邻条目有承接关系（前一项的结果成为后一项的原因）。并列的同质观察步骤（多次"试探-确认规则"）不是发展，是列表。主线推进弧至少发生一次问题升级：子问题变得更大、更尖锐、或牵连更多；关系/铺垫弧不强求问题升级，以其功能证据为准。
    2. 压力类型轮换：弧内压力源可在物理威胁、制度规则、未知存在、人际关系之间轮换。连续同类压力应升级规模、代价或牵连，否则读者产生疲劳；安静弧以压力节奏的合理分布为准，不要求每类压力都出现。安静、等待、内省章节可以存在，但应由压力轮换、问题阶梯或功能说明其位置。
    3. 场景因果链：每个场景的 outcome 应成为下一场景 situation 的触发条件（显式写"因此，下一步……"）。检验方法：把各场景 outcome 连读，若抽掉任一场景后其余外部因果不受影响，则该场景必须承担"关系温度、理解修正、余波承载或独立体验"功能，否则视为赘余，应合并或删除。氛围、铺垫和余波场景可以存在，但必须留下读者可感知的东西，不能只是过程流水。
    4. 安静章功能：无外部事件的章节应让读者获得可感知的新东西——关系温度变化、风险判断改变、物品易主、理解修正、情绪确认或余波承载中的至少一项。确认规则的陈述若改变了角色后续选择或风险判断，即算功能；若只是认知登记且无后续影响，则并入相邻章节。安静章不需要被改造成冲突升级。
    5. 不可逆出口：推进型弧的 arc.exitState 相对 entryState 应有至少一项不可逆变化（身份、资源、知识、关系或威胁级别）；铺垫/过渡弧的出口可以保持稳定，但必须说明本弧承担的静态功能（铺了什么、理解了什么、关系移到了哪里）。若一个推进型弧结束时主角仍处于入口状态、只是多知道几条规则，则该弧需要重新设计。
    6. 责任衔接：threadResponsibilities 的 nextAdvance 到期线应在本弧内出现可观察兑现或显式升级；到期而未推进的线要写明保持/观察责任，不能静默消失。
  arc.review: |
    按弧设计质量审核，不替正文规定审美。五项契约是检查方向与证据类型，不是必须全部成立的硬门：先判断本弧承诺的功能（推进主线、关系升温、铺垫、余波、世界展开等），再检查承载该功能的设计契约是否成立、是否有可感知证据；不适用于本弧功能的契约不构成问题。安静、关系、背景、铺垫和余波弧与行动弧同样合法，只要其功能有可感知证据。
    1. 问题阶梯：主线推进弧的核心读者问题是否明确，development[] 是否呈因果承接的子问题链而非并列步骤；关系/铺垫弧以关系温度或理解变化为推进，不强制要求问题升级。
    2. 压力轮换：连续同类压力是否升级了规模、代价或牵连；安静弧以压力节奏的合理分布为准，不要求每类压力都出现。
    3. 场景因果：各场景 outcome 是否成为下一场景 situation 的触发条件；不推动外部因果的场景是否承担了关系温度/理解修正/余波承载或独立体验功能。
    4. 安静章功能：无外部事件的章节是否让读者获得可感知的新东西（关系温度/风险判断/物品易主/理解修正/情绪确认/余波承载）；确认规则的陈述若改变了角色后续选择或风险判断，即算功能；若只是认知登记且无后续影响，报告为过程流水。
    5. 不可逆出口：exitState 相对 entryState 是否有可感知变化；对推进型弧，变化通常是身份、资源、知识、关系或威胁级别的不可逆项；对铺垫/过渡弧，出口可保持稳定，但必须说明本弧承担的静态功能（铺了什么、理解了什么、关系移到了哪里）。
    6. 责任衔接：到期 nextAdvance 是否兑现或显式升级；静默消失的长线报告为结构问题。
    7. 读者回报：以目标读者视角检查本弧的入口期待与出口回报是否匹配——本弧在 entryState/objective 中承诺了什么体验（解决问题、关系升温、世界揭秘、认知落差、情绪确认），exitState 与 development 是否真的交付了这种体验；若弧结束时读者只经历了过程而没有获得解决、成长、理解、情绪或新问题中的任何回报，报告为节奏问题。安静弧的回报可以是理解修正或关系温度，不要求每弧都交付事件性高潮。
    只有契约缺失且确实损害了本弧承诺功能的证据时才报告 major；弧级判定不要求每章事件、反转或不可逆变化。
  arc.revision: |
    修订故事弧时优先修复设计契约：先补问题阶梯（把并列步骤重排为因果子问题链，或改写 development 让每项承接前项），再修压力轮换与场景因果串联，最后处理责任衔接。不通过增加事件数量、补写正文摘要或强行制造冲突掩盖设计缺陷。保留已成立的人物选择、关系积累、前置证据与合理未知；安静章若没有可感知收益则并入相邻章节而不是硬加事件，安静弧按其功能证据修订而不是改造成行动弧。
  chapter.blueprint: |
    每章蓝图应说明它在本弧中的功能位置：回答或升级弧内哪个子问题，或承担关系温度、铺垫、理解修正、余波等功能；推进型章节的结束状态应相对起始状态改变认知、资源、关系、威胁或位置中的至少一项，安静章应让读者获得可感知的收益（关系温度/风险判断/物品易主/理解修正/情绪确认/余波承载）。场景 outcome 要连回下一场景的 situation，章节之间保持因果承接而不是并列罗列；不推动外部因果的场景必须有独立体验或理解修正价值。不要为了满足格式虚构阻力或选择；安静章不需要被改造成冲突升级，但应说明它让读者获得了什么新东西。等待、旅行、调查和准备章可以存在，只要其功能有可感知证据。
