skillId: review-gate
version: 1.1.0
executionPoints:
  - foundation.book-plan
  - arc.review
  - chapter.review.structure
  - chapter.review.character
  - chapter.review.prose
roles:
  - foundation-reviewer
  - structure-reviewer
  - prose-reviewer
  - character-reviewer
capabilities:
