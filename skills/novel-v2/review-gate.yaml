skillId: review-gate
version: 1.0.0
executionPoints:
  - foundation.book-plan
  - arc.review
  - chapter.review.structure
  - chapter.review.character
  - chapter.review.prose
roles:
  - foundation-reviewer
  - structure-reviewer
  - prose-reviewer
  - character-reviewer
capabilities:
  - review
dependsOn:
  - narrative-continuity
conflicts: []
requiredMemoryKinds: []
qualityGates:
  - evidence-grounding
  - dimension-coverage
priority: required
promptSections:
  foundation.book-plan: |
    以项目级架构审核而非正文审美为目标：检查读者承诺、主题问题、人物矛盾、世界压力、层级边界、剧情线和终局边界是否互相支持。每个问题引用 structuredData/sections/summary 的路径或片段，说明问题机制、影响范围和最小修复方向；区分事实缺口、因果缺口、待确认项和个人偏好。以目标读者视角加查八项：承诺可兑现（卖点是否是可体验的冲突组合而非名词堆）、主题进入选择（主题是否落在人物利益/关系/责任/代价的具体选择上）、欲望-阻力-选择-代价闭环、配角独立欲望与关系网络、世界观规则改变人物可选集合（删掉设定名词后选择是否不变）、感情线靠行动累积而非宣言、重复与升级是否改变层级/意义/代价、读者不确定性是否有可推断证据。八项是检查方向，不是必须全部成立的硬门；按当前 taskKey 的适用性选择，不适用项跳过，只有缺失确实损害已承诺功能时才报告。
  arc.review: |
    每个问题必须指向蓝图中的具体字段、章节或场景证据，并说明问题机制、影响范围和最小修复方向；区分事实/权威错误、因果/结构问题和风格偏好，不把个人偏好伪装成硬约束。
  chapter.review.character: |
    以人物独立欲望、目标、行为、选择、语言、知识边界和关系反应为证据，覆盖人物刻画、能动性与群像变化；不要求没有相关内容的章节强行安排关系变化。
  chapter.review.structure: |
    以冻结事实、规划上下文和正文证据审视结构、因果、章节功能、世界规则、时间线、人物知识边界、承诺证据和选择后果；不以固定章数、钩子或升级密度判定质量。
  chapter.review.prose: |
    以正文证据审视场景体验、语言、具体性、叙述距离、节奏、情绪抵达和幽默；检查关键选择/情绪是否被摘要跳过，只报告有正文证据且影响阅读的普遍问题。
