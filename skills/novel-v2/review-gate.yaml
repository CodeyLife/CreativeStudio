  - dimension-coverage
priority: required
promptSections:
  foundation.book-plan: |
     以项目级架构审核而非正文审美为目标：检查读者承诺、主题问题、人物矛盾、世界压力、层级边界、剧情线和终局边界是否互相支持。
     每个问题引用 structuredData/sections/summary 的路径或片段，说明问题机制、影响范围和最小修复方向；区分事实缺口、因果缺口、待确认项和个人偏好。
     以目标读者视角加查**十项**（2026-10-14 round 41 补齐：原八项 + 审核 prompt 已有但 skill 未登记的两项）：
     承诺可兑现（卖点是否是可体验的冲突组合而非名词堆）、主题进入选择（主题是否落在人物利益/关系/责任/代价的具体选择上）、
     欲望-阻力-选择-代价闭环（prompt 内作「最小动力闭环」）、配角独立欲望与关系网络（prompt 内作「群像独立」）、
     世界观规则改变人物可选集合（prompt 内作「世界观压力系统」）、感情线靠行动累积而非宣言（prompt 内作「感情线行动累积」）、
     重复与升级是否改变层级/意义/代价（prompt 内作「疲劳管理」）、读者不确定性是否有可推断证据（prompt 内作「留白证据」）、
     **表层大众化**（卷名/章名/概念术语是否落在目标读者熟悉的语域；机制层可技术化，但叙述者给世界贴标签的层面不得技术化）、
     **揭示物分层**（核心创意与世界观真相是否写成剧情揭示物而非开篇设定；区分世界表面事实/异常现象/底层真相三层）。
     **口径对应已核验**（tmp/state-audit/verify-review-gate-eight-items.mts）：十项在审核 prompt 里逐项有对应检查项，
     且 foundation-contract 的 error 级门只有结构契约字段——故「是检查方向而非硬门」的承诺成立。
     十项是检查方向，不是必须全部成立的硬门；按当前 taskKey 的适用性选择，不适用项跳过，只有缺失确实损害已承诺功能时才报告。
  arc.review: |
    每个问题必须指向蓝图中的具体字段、章节或场景证据，并说明问题机制、影响范围和最小修复方向；区分事实/权威错误、因果/结构问题和风格偏好，不把个人偏好伪装成硬约束。
  chapter.review.character: |
    以人物独立欲望、目标、行为、选择、语言、知识边界和关系反应为证据，覆盖人物刻画、能动性与群像变化；不要求没有相关内容的章节强行安排关系变化。
  chapter.review.structure: |
    以冻结事实、规划上下文和正文证据审视结构、因果、章节功能、世界规则、时间线、人物知识边界、承诺证据和选择后果；不以固定章数、钩子或升级密度判定质量。
  chapter.review.prose: |
    以正文证据审视场景体验、语言、具体性、叙述距离、节奏、情绪抵达和幽默；检查关键选择/情绪是否被摘要跳过，只报告有正文证据且影响阅读的普遍问题。
