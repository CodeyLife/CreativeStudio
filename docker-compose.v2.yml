name: creative-studio

services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_DB: ymcp
      POSTGRES_USER: ymcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ymcp}
    ports: ["5432:5432"]
    volumes: ["ymcp-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymcp -d ymcp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup@sha256:9be7b8d98f60d00f4f2ff74731c071a17848d8182bbc8429e314a24c94ea105b
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ymcp
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-ymcp}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 namespace list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui@sha256:b839b5c798770896c78058db1647d325a19b3acef7fa1fbd9a23fabb1dd7feb2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_started
    ports: ["8088:8080"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    ports: ["6333:6333", "6334:6334"]
    volumes: ["ymcp-qdrant:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ymcp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ymcp-minio-local}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["ymcp-minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  embedding:
    profiles: ["local-embedding"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:89-1.9}
    command: ["--model-id", "BAAI/bge-m3", "--revision", "5617a9f61b028005a4858fdac845db406aefb181", "--served-model-name", "bge-m3", "--max-client-batch-size", "64"]
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    ports: ["8081:80"]
    volumes: ["ymcp-tei-cache:/data"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  api:
    profiles: ["container"]
    build: .
    command: ["node", "--import", "tsx", "scripts/novel-v2-api.ts"]
    environment: &runtime-env
      DATABASE_URL: postgresql://ymcp:${POSTGRES_PASSWORD:-ymcp}@postgres:5432/ymcp
      NOVEL_RUNTIME_PROFILE: ${NOVEL_RUNTIME_PROFILE:-local-hybrid}
      NOVEL_RUNTIME_ID: ${NOVEL_RUNTIME_ID:-creative-studio-local-hybrid}
      NOVEL_PROJECT_ROOT: /app
      NOVEL_V2_MIGRATIONS_DIR: /app/deploy/postgres
      TEMPORAL_ADDRESS: temporal:7233
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: novel-memory-current
      NOVEL_EMBEDDING_DIM: "1024"
      NOVEL_EMBEDDING_MODEL: BAAI/bge-m3
      NOVEL_EMBEDDING_REVISION: siliconflow-managed
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      NOVEL_OBJECT_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:-ymcp-novel}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ymcp}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-ymcp-minio-local}
      NOVEL_API_HOST: 0.0.0.0
      NOVEL_MODEL_CONFIG_PATH: /app/config/model-providers.local.yaml
    volumes:
      - ./config:/app/config
    ports: ["4770:4770"]
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_healthy }
      minio: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4770/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    profiles: ["container"]
    build: .
    command: ["node", "--import", "tsx", "scripts/novel-v2-worker.ts"]
    environment:
      <<: *runtime-env
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: "4771"
    volumes:
      - ./config:/app/config
    ports: ["4771:4771"]
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_healthy }
      minio: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4771/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    profiles: ["container"]
    build: .
    command: ["pnpm", "dev:web", "--host", "0.0.0.0"]
    environment:
      NOVEL_V2_API_URL: http://api:4770
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

volumes:
  ymcp-postgres:
    name: ${NOVEL_POSTGRES_VOLUME:-creative_studio_novel_postgres}
  ymcp-qdrant:
    name: ${NOVEL_QDRANT_VOLUME:-creative_studio_novel_qdrant}
  ymcp-minio:
    name: ${NOVEL_MINIO_VOLUME:-creative_studio_novel_minio}
  ymcp-tei-cache:
    name: ${NOVEL_TEI_VOLUME:-creative_studio_novel_tei_cache}
